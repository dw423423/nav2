following_server:
  ros__parameters:
    controller_frequency: 10.0
    detection_timeout: 2.0
    rotate_to_object_timeout: 10.0
    static_object_timeout: 30.0
    linear_tolerance: 0.15
    angular_tolerance: 0.15
    max_retries: 3

    base_frame: "base_link"
    fixed_frame: "odom"

    filter_coef: 0.1
    desired_distance: 1.0
    skip_orientation: true
    search_by_rotating: false

    odom_topic: "/Odometry"
    odom_duration: 0.3
    transform_tolerance: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      slowdown_radius: 0.15
      use_collision_detection: false
      transform_tolerance: 0.5

lifecycle_manager_following:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - following_server